services:
  - type: web
    name: gold-predictor-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --workers 1 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: PYTHON_VERSION
        value: 3.10.13